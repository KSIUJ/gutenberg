name: Gutenberg

on:
  push:
    branches:
      - main

jobs:
  deploy_mdbook:
    concurrency:
      cancel-in-progress: false
      group: "gh-pages"

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            docs
            Dockerfile
            .dockerignore

      - name: Build documentation with Docker
        # Using an environment variable avoids word-splitting and shell injection
        # if the runner temp directory path contains spaces or special characters.
        env:
          OUTPUT_DIR: ${{ runner.temp }}/book
        run: docker build --target build_docs --output "type=local,dest=$OUTPUT_DIR,src=/app/docs/book" .

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/book

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
