# Test Scenario 1: SSL Disabled (backward compatibility)
# Expected: HTTP on 80 works, no HTTPS, default behavior

services:
  proxy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: run_nginx
    ports:
      - "8080:80"
    environment:
      # No SSL variables - should work as before
      GUTENBERG_TRUSTED_PROXY_IPS: "172.17.0.0/16"
    command: nginx -g 'daemon off;'
