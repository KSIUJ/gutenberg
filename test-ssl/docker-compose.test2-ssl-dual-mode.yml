# Test Scenario 2: SSL Enabled Dual-Mode
# Expected: Both HTTP (80) and HTTPS (443) serve content

services:
  proxy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: run_nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - type: bind
        source: /home/dawidbukowski/IdeaProjects/gutenberg/test-ssl/fullchain.pem
        target: /etc/ssl/certs/gutenberg.crt
        read_only: true
      - type: bind
        source: /home/dawidbukowski/IdeaProjects/gutenberg/test-ssl/privkey.pem
        target: /etc/ssl/certs/gutenberg.key
        read_only: true
    environment:
      GUTENBERG_SSL_ENABLE: "1"
      GUTENBERG_SSL_CERT_PATH: "/etc/ssl/certs/gutenberg.crt"
      GUTENBERG_SSL_KEY_PATH: "/etc/ssl/certs/gutenberg.key"
      GUTENBERG_TRUSTED_PROXY_IPS: "172.17.0.0/16"
    command: nginx -g 'daemon off;'
