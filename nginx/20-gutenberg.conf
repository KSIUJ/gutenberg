server {
    listen 80;

    # Log format for untrusted proxy errors is defined at http level (generated by entrypoint script)
    # Use conditional access log based on $is_trusted_proxy value
    access_log /dev/stderr gutenberg_untrusted_proxy if=$is_not_trusted_proxy;

    # `$is_trusted_proxy` and `$is_not_trusted_proxy` are defined
    # in the `10-gutenberg-trusted-proxies.conf` file generated at runtime
    # by the `40-configure-trusted-proxies.sh` entrypoint script.
    #
    # This check rejects requests from IP addresses not listed in the
    # `GUTENBERG_TRUSTED_PROXY_IPS` environment variables.
    if ($is_trusted_proxy = 0) {
        # Returns a plain 400 Bad Request response to avoid leaking network configuration details
        return 400;
    }

    include /etc/nginx/gutenberg-locations.d/*.conf;
}
